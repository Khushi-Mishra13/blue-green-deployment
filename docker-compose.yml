services:
  blue:
    build:
      context: .
    networks: 
      - app-network
    environment:
      VERSION: Blue-V1

  green:
    build:
      context: .
    networks: 
      - app-network
    environment:
      VERSION: Green-V2
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: 
      - app-network

networks:
  app-network: 
